[package]
name = "pips-sign"
version = "0.1.0"
description = "Pips identities: Ed25519 card signatures, edition certificates, transfer envelopes, recovery words and paper keys"
keywords = ["ed25519", "bip39", "signature", "pixel-art", "no_std"]
categories = ["cryptography", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pips-sign"
path = "src/bin/pips-sign.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:getrandom"]

[dependencies]
pips-format = { path = "../pips-format", default-features = false }
pips-base45 = { path = "../pips-base45", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }
bip39 = { version = "2", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", optional = true }

[lints]
workspace = true
